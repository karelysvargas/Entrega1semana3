services:
  # Aplicación (producción: Nginx con el Dockerfile compilado)
  recetario-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetario_desayunos_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      recetario-db:
        condition: service_healthy

  # Base de datos
  recetario-db:
    image: postgres:16-alpine
    container_name: recetario_desayunos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recetario
      POSTGRES_USER: recetario
      POSTGRES_PASSWORD: recetario123
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recetario -d recetario"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Desarrollo con recarga en vivo (no arranca por defecto)
  recetario-dev:
    image: node:20-alpine
    container_name: recetario_desayunos_dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development

volumes:
  db_data:
