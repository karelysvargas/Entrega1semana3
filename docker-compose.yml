version: '3.8'

services:
  # Servicio de producción (usando Nginx y el Dockerfile compilado)
  recetario-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetario_desayunos_prod
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production

  # Servicio para desarrollo con recarga en vivo (Vite)
  recetario-dev:
    image: node:20-alpine
    container_name: recetario_desayunos_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
